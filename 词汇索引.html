Regen, der Schnee, der Wind, der Nebel 酒类 der der Wein, der Sekt, der Schnaps 车辆品牌 der der BMW, der Mercedes, "},"b1s4":{"p":"b1grammar","h":"","s":"6 反身代词 Dativ Reflexivpronomen im Dativ 规则： 当反身动词带有直接宾语（Akkusativ-Objekt）时，反身代词用 第三格 Dativ 。如果只有反身代词（无其他宾语），则用第四格 Akkusativ。 人称 Akkusativ Dativ 示例 (Dativ) ich mich mir Ich wasche mir die Hände. du dich"},"b1s3":{"p":"b1grammar","h":"","s":"5 过去完成时 Plusquamperfekt 规则： 过去完成时表示\"过去的过去\"，即先于另一个过去动作发生的动作。构成： hatte/war + Partizip II 。常与 nachdem （在……之后）搭配使用。 句型 示例 中文 nachdem + 过去完成时, 主句过去式 Nachdem ich gegessen hatte , ging ich spazieren. 我吃完饭后去散"},"b1s5":{"p":"b1grammar","h":"","s":"7 可分/不可分动词 Trennbare & Untrennbare Verben 规则： 前缀决定动词是否可分。 不可分前缀 （be-, ge-, ver-, zer-, ent-, emp-, er-, miss-）始终与动词连在一起。可分前缀（an-, auf-, aus-, ein-, mit-, zu-, ab-, vor-, nach- 等介词类前缀）在主句现在时/过去式中分离至句末。"},"b1s6":{"p":"b1grammar","h":"","s":"8 动词+介词搭配 Verben mit Präpositionen 规则： 许多德语动词有固定的介词搭配，介词决定后续名词的格。必须作为固定搭配整体记忆。本节收录约90组常见搭配，按介词分组。 加锁内容 · 全站定制专属 。 auf + A 动词+介词 例句 中文 achten auf Bitte achte auf den neuen Mantel. 注意/爱护 ankommen auf Es"},"b1s7":{"p":"b1grammar","h":"","s":"9 代副词 Präpositionaladverbien 规则： 当介词宾语不是\"人\"而是事物/概念/句子时，用 da(r) + 介词 替代。如果介词以元音开头，加 -r-： da r auf, da r an, da r über 。 代副词 = 介词 + ? 示例 中文 darauf auf + das Ich warte darauf . 我在等这个。 daran an + das Denk"},"b1s8":{"p":"b1grammar","h":"","s":"10 Konjunktiv 虚拟式 KI / KII 统一公式 · 核心抽象（先看这个！） 一句话心法： KI 和 KII 词尾完全相同 ，区别 只在词干 ——KI 用 现在时词干 （不定式去 -en），KII 用 过去时词干 （能加 Umlaut 就加）。规则/不规则不是两套规则，只是\"过去时词干长什么样\"的差异。 共用词尾（KI / KII 一模一样）： 人称 词尾 例：mach- (KI 现"},"b1s9":{"p":"b1grammar","h":"","s":"11 Passiv 被动语态 🔑 核心心法 · 一句话看懂被动态六时态 所谓\"被动态六时态\"，其实可以理解为： Partizip II 本身就负责\"被\"的含义 （gebaut = 被建造的状态） 时态完全交给助动词 sein / werden 自己变 （它们本来是什么时态，整句就是什么时态） 过程被动 = werden 走完六时态 ｜ 状态被动 = sein 走完六时态 ⚠️ 唯一的特例： we"},"b1s12":{"p":"b1grammar","h":"","s":"12 Futur I 将来时 规则： 构成： werden + Infinitiv 。两种用法： 1) 表示将来发生的事情； 2) 表示对现在/将来的 推测 （vermuten）。 用法 示例 中文 将来 Ich werde morgen nach Berlin fahren . 我明天将去柏林。 将来 Nächste Woche wird es regnen. 下周会下雨。 推测 Sie wir"},"b1s13":{"p":"b1grammar","h":"","s":"13 lassen 使役动词 规则： lassen + Infinitiv 有三个核心含义： 1) 委托/让别人做某事； 2) 允许/让某人做某事； 3) 表示\"可以/能够\"（被动替代）。lassen 的过去分词是 gelassen ，但与另一动词连用时用 lassen （类似情态动词的双不定式规则）。 含义 示例 中文 委托 Ich lasse mein Auto reparieren. 我让人"},"b1s14":{"p":"b1grammar","h":"","s":"14 位移动词 Positions- & Direktionsverben 规则： 德语严格区分 位置（在哪里） 和 方向（去哪里） 。位置动词 + Dativ，方向动词 + Akkusativ。常见配对如下： 方向 (→Akk) 位置 (→Dat) 中文 示例 (位置 → 方向) legen liegen 放/躺 Das Buch liegt auf dem Tisch. → Ich lege "},"b1s15":{"p":"b1grammar","h":"","s":"15 Genitiv 属格 规则： 属格表示 所属关系 （……的）。阳性/中性名词加 -(e)s ，阴性/复数不加词尾。冠词变化：der→des, die→der, das→des, die(Pl.)→der。在口语中常被 von + Dativ 替代。 词性 Nominativ Genitiv 示例 der der Mann des Mann es das Auto des Mannes die"},"b1s16":{"p":"b1grammar","h":"","s":"16 n-Deklination 阳性弱变化 规则： 某些阳性名词在除 Nominativ 单数外的所有格中都加 -(e)n 。这些名词通常是：以 -e 结尾的阳性名词（表人或动物），以及少数特殊阳性名词。 Nominativ Akkusativ Dativ Genitiv 中文 der Student den Student en dem Student en des Student en 大学"},"b1s17":{"p":"b1grammar","h":"","s":"17 形容词名词化 Adjektive als Nomen 规则： 形容词可以名词化（大写开头），但仍保持形容词词尾变化。指人： der/die + 形容词词尾 ；指事物： das + 形容词词尾 。 形容词 指人 (der/die) 指事物 (das) 中文 alt der Alte / die Alte das Alte 老人 / 旧东西 krank der Kranke / die Kran"},"b1s18":{"p":"b1grammar","h":"","s":"18 间接问句 Indirekte Fragen 规则： 间接问句将疑问句嵌入到主句中，使用 从句语序（动词在句末） 。W-Fragen 用原疑问词引导；Ja/Nein-Fragen 用 ob 引导。 直接问句 间接问句 中文 Wo wohnt er? Ich weiß nicht, wo er wohnt . 我不知道他住哪里。 Wann kommt der Zug? Kannst du mir"},"b1s19":{"p":"b1grammar","h":"","s":"19 Infinitiv + zu 规则： 某些动词、形容词、名词结构后接带 zu 不定式。zu 放在不定式前， 可分动词中 zu 插在可分前缀与词根之间 。不定式短语放在句末，前面通常加逗号。 触发结构 示例 中文 动词 + zu Ich versuche , Deutsch zu lernen . 我尝试学德语。 动词 + zu Er hat vergessen , die Tür zuzum"},"b1s20":{"p":"b1grammar","h":"","s":"20 关系从句 Relativsätze 规则： 关系从句用关系代词 der, die, das 等引导，放在被修饰名词之后。关系代词的 性（Genus）和数（Numerus） 与先行词一致， 格（Kasus） 由从句中的动词/介词决定。从句语序：动词在句末。 关系代词 Nominativ Akkusativ Dativ der (m.) der den dem die (f.) die die "},"ex1":{"p":"mix","h":"冠词填空 Artikel einsetze // ── 全文搜索（基于内嵌索引）──
function searchFullText(query){
  const lower = query.trim().toLowerCase();
  if (!lower || lower.length < 2) return null;
  const idx = FT_INDEX_DATA.index;

  let sectionIds = idx[lower];
  if (!sectionIds) {
    const keys = Object.keys(idx);
    const matches = keys.filter(k => k.startsWith(lower) || k.includes(lower));
    if (matches.length === 0) return { grouped: {}, total: 0 };
    const secSet = new Set();
    matches.forEach(k => { idx[k].split(' ').forEach(s => secSet.add(s)); });
    sectionIds = Array.from(secSet).join(' ');
  }

  const secList = typeof sectionIds === 'string' ? sectionIds.split(' ') : sectionIds;

  const grouped = {};
  secList.forEach(sid => {
    const meta = FT_INDEX_DATA.sections[sid];
    if (!meta) return;
    const pid = meta.p;
    if (!grouped[pid]) grouped[pid] = [];
    if (grouped[pid].length < 5) {
      grouped[pid].push({ sectionId: sid, heading: meta.h, snippet: meta.s });
    }
  });

  return { grouped: grouped, total: secList.length };
}

  if (!result || Object.keys(result.grouped).length === 0) {
    list.innerHTML = '<div class="ft-empty">🔍 全站未找到 "<b>' + escHtml(query) + '</b>"<br><span style="font-size:.72rem;color:#5a6b85">（已扫描 A1/A2/B1 语法·听力·写作·阅读·综合·数据图表 全部章节）</span></div>';
    empty.style.display = 'none';
    return;
  }

  const grouped = result.grouped;
  const pageIds = Object.keys(grouped);
  const totalMatches = pageIds.reduce((s, pid) => s + grouped[pid].length, 0);

  let html = '<div style="font-size:.72rem;color:#7f8da3;text-align:center;margin-bottom:12px">🔍 在 <b style="color:#f6d365">' + pageIds.length + '</b> 个页面找到 <b style="color:#f6d365">' + totalMatches + '</b> 处</div>';

  pageIds.forEach(pid => {
    const items = grouped[pid];
    const pageName = FT_INDEX_DATA.pages[pid] || pid;
    const icon = pageName.slice(0, 2);
    html += '<div class="ft-group">';
    html += '<div class="ft-group-hd" onclick="__jumpToPage(\'' + pid + '\')"><span class="pg-icon">' + icon + '</span> ' + escHtml(pageName) + '<span class="ft-count">' + items.length + ' 处</span></div>';

    let lastHeading = '';
    items.forEach(item => {
      if (item.heading && item.heading !== lastHeading) {
        lastHeading = item.heading;
        html += '<div class="ft-sec">▸ ' + escHtml(item.heading) + '</div>';
      }
      const lower = query.trim().toLowerCase();
      let snip = escHtml(item.snippet || '');
      const escaped = lower.replace(/[.*+?$^{}()|[\]\\]/g, '\\$&');
      snip = snip.replace(new RegExp('(' + escaped + ')', 'gi'), '<mark>$1</mark>');
      html += '<div class="ft-item" onclick="__jumpToPage(\'' + pid + '\', \'' + (item.sectionId || '') + '\')">' + snip + '</div>';
    });
    html += '</div>';
  });

  list.innerHTML = html;
  empty.style.display = 'none';
}

// 跳转到页面指定 section
function jumpToPage(pageId, sectionId){
  var target = sectionId || pageId;
  // 方式1：postMessage 给父页面（跨 iframe 最可靠，index.html 监听 goto-section）
  try { window.parent.postMessage({type:"goto-section", section:target}, "*"); } catch(e) {}
  // 方式2：直调父页面函数
  try {
    if (window.parent && window.parent !== window && typeof window.parent.gotoSection === "function") {
      window.parent.gotoSection(target);
    }
  } catch(e) {}
  // 方式3：独立页面 — 直接用 location 跳转
  if (!window.parent || window.parent === window) {
    window.location.href = "index.html#" + target;
  }
}
window.__jumpToPage = jumpToPage;

// ── 从全站索引中找跨页面词（用于 cross/syn 增强）──
function getCrossPageWords(query, minPages){
  var result = [];
  var idx = FT_INDEX_DATA.index;
  var secs = FT_INDEX_DATA.sections;
  var keys = query ? Object.keys(idx).filter(function(k){ return k.indexOf(query)>=0; }) : Object.keys(idx);
  keys.forEach(function(word){
    var secIds = idx[word].split(' ');
    // 统计出现在几个不同页面
    var pages = new Set();
    secIds.forEach(function(sid){ var m = secs[sid]; if (m) pages.add(m.p); });
    if (pages.size >= minPages) {
      result.push({ word: word, pageCount: pages.size, sectionCount: secIds.length, sections: secIds, pages: Array.from(pages) });
    }
  });
  // 按跨页数量降序
  result.sort(function(a,b){ return b.pageCount - a.pageCount; });
  return result;
}

// ── 词汇库渲染 ──
function renderVocab(query){
  const q = (query||'').trim().toLowerCase();
  const list = document.getElementById('list');
  var html = '';
  var curAlpha = '';
  var count = 0;
  var showFT = (curFilter === 'cross' || curFilter === 'syn');

  // 1) 先渲染词汇库匹配结果
  VOCAB.words.forEach(function(w){
    if (!matchFilter(w)) return;
    if (q){
      var hay = (w.w+' '+w.m+' '+w.syn.join(' ')).toLowerCase();
      if (!hay.includes(q)) return;
    }
    count++;
    if (!q && curFilter==='all'){
      var a = w.w.replace(/^(der|die|das|sich|ein|eine)\s+/i,'').charAt(0).toUpperCase();
      if (a !== curAlpha){ curAlpha = a; html += '<div class="alpha">' + a + '</div>'; }
    }
    var cross = w.occ.length>1;
    var occLinks = w.occ.map(function(an){
      return '<span class="occ-link" onclick="__jump(\'' + an + '\')">📖 ' + titleOf(an) + '</span>'; }).join('');
    var synRow = w.syn.length
      ? '<div class="rel-row"><span class="tag">近义</span>' + w.syn.map(function(s){ return '<span class="syn-word">' + s + '</span>'; }).join('') + '</div>'
      : '';
    html += '<div class="card' + (q?' ':'') + '">' +
      '<div class="top">' +
        '<span class="w">' + w.w + '</span>' +
        '<span class="lv lv-' + w.lv + '">' + w.lv.toUpperCase() + '</span>' +
        (cross?'<span class="crossbadge">⭐ ' + w.occ.length + ' 篇出现</span>':'') +
      '</div>' +
      '<div class="m">' + w.m + '</div>' +
      '<div class="rels">' +
        '<div class="rel-row"><span class="tag">出现在</span>' + occLinks + '</div>' +
        synRow +
      '</div>' +
    '</div>';
  });

  // 2) 跨篇/近义模式下，补充全站索引中跨3+页面的词
  if (showFT && q) {
    var ftWords = getCrossPageWords(q, 3);
    if (ftWords.length > 0) {
      html += '<div class="alpha" style="color:#a78bfa;border-color:rgba(139,92,246,.25)">🌐 全站跨页匹配 <span style="font-size:.65rem;color:#7f8da3;font-weight:400">（来自全站文本索引）</span></div>';
      ftWords.slice(0, 20).forEach(function(fw){
        var secIds = fw.sections.slice(0, 5);
        var secLinks = secIds.map(function(sid){
          var meta = FT_INDEX_DATA.sections[sid];
          var pName = meta ? (FT_INDEX_DATA.pages[meta.p]||meta.p) : sid;
          return '<span class="occ-link" style="background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.3);color:#c4b5fd" onclick="__jumpToPage(\'' + (meta?meta.p:'') + '\',\'' + sid + '\')">📄 ' + escHtml(pName.slice(0,15)) + '</span>';
        }).join('');
        html += '<div class="card" style="border-color:rgba(139,92,246,.2)">' +
          '<div class="top">' +
            '<span class="w" style="color:#c4b5fd">' + fw.word + '</span>' +
            '<span class="crossbadge" style="background:rgba(139,92,246,.2);color:#c4b5fd">🌐 ' + fw.pageCount + ' 个页面</span>' +
          '</div>' +
          '<div class="rels">' +
            '<div class="rel-row"><span class="tag" style="color:#a78bfa">出现在</span>' + secLinks + '</div>' +
          '</div>' +
        '</div>';
      });
    }
  }

  list.innerHTML = html;
  document.getElementById('empty').style.display = (count || (showFT && q)) ? 'none' : 'block';
}

function render(query){
  document.getElementById('ftloading').style.display = 'none';
  document.getElementById('ftfail').style.display = 'none';
  if (curFilter === 'fulltext') {
    renderFullText(query);
  } else {
    renderVocab(query);
  }
}

document.getElementById('q').addEventListener('input', e => render(e.target.value));

document.querySelectorAll('.fbtn').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    curFilter = b.dataset.f;
    document.getElementById('hintmulti').textContent =
      curFilter==='cross' ? '⭐ 这些词在多篇文章里都出现过 —— 点篇目可直接跳过去对照' :
      curFilter==='syn' ? '这些词有近义/同义表达，点篇目看它们各自的语境' :
      curFilter==='fulltext' ? '🔍 全文搜索：扫描主站全部页面章节（A1/A2/B1 语法·听力·写作·阅读·综合·数据）' : '';
    document.getElementById('empty').style.display = 'none';
    document.getElementById('ftloading').style.display = 'none';
    document.getElementById('ftfail').style.display = 'none';
    render(document.getElementById('q').value);
  });
});

render('');
</script>
