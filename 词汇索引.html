<script>
// 补充无标题锚点
const TITLES = Object.assign({
  'b1-deutschland-wortschatz': '🇩🇪 Was ist typisch deutsch? B1 词汇',
}, VOCAB.titles);
function titleOf(anchor){ return TITLES[anchor] || anchor; }

// 锚点 → 所属页面名（用于跳转时父页面切页）。a2l-* → a2lesen，b1* → b1lesen
function pageOf(anchor){
  if (anchor.indexOf('a2l') === 0 || anchor.indexOf('a2lesen') === 0) return 'a2lesen';
  return 'b1lesen';
}

// 统计条
document.getElementById('stats').innerHTML =
  `<div class="st"><b>${VOCAB.stats.total}</b>收录词</div>`+
  `<div class="st"><b>${VOCAB.stats.crossArticle}</b>跨篇同词</div>`+
  `<div class="st"><b>${Object.keys(TITLES).length}</b>篇文章</div>`;

// 跳转：postMessage（跨 iframe / 本地 file:// 都通），同源兜底直调
function jumpTo(anchor){
  try{ window.parent.postMessage({type:'goto-section',section:anchor},'*'); }catch(e){}
  try{ if(window.parent && typeof window.parent.gotoSection==='function') window.parent.gotoSection(anchor); }
  catch(e){ try{window.location.hash='#'+anchor;}catch(e2){} }
}
window.__jump = jumpTo;

let curFilter = 'all';

function matchFilter(w){
  if (curFilter==='all') return true;
  if (curFilter==='cross') return w.occ.length>1;
  if (curFilter==='syn') return w.syn.length>0;
  if (curFilter==='a2') return w.lv==='a2';
  if (curFilter==='b1') return w.lv==='b1';
  return true;
}

function render(query){
  const q = (query||'').trim().toLowerCase();
  const list = document.getElementById('list');
  let html = '';
  let curAlpha = '';
  let count = 0;
  VOCAB.words.forEach(w=>{
    if (!matchFilter(w)) return;
    if (q){
      const hay = (w.w+' '+w.m+' '+w.syn.join(' ')).toLowerCase();
      if (!hay.includes(q)) return;
    }
    count++;
    // 字母分组（无搜索时）
    if (!q && curFilter==='all'){
      const a = w.w.replace(/^(der|die|das|sich|ein|eine)\s+/i,'').charAt(0).toUpperCase();
      if (a !== curAlpha){ curAlpha = a; html += `<div class="alpha">${a}</div>`; }
    }
    const cross = w.occ.length>1;
    const occLinks = w.occ.map(an=>
      `<span class="occ-link" onclick="__jump('${an}')">📖 ${titleOf(an)}</span>`).join('');
    const synRow = w.syn.length
      ? `<div class="rel-row"><span class="tag">近义</span>${w.syn.map(s=>`<span class="syn-word">${s}</span>`).join('')}</div>`
      : '';
    html += `<div class="card${q&&'w'?' ':''}">
      <div class="top">
        <span class="w">${w.w}</span>
        <span class="lv lv-${w.lv}">${w.lv.toUpperCase()}</span>
        ${cross?`<span class="crossbadge">⭐ ${w.occ.length} 篇出现</span>`:''}
      </div>
      <div class="m">${w.m}</div>
      <div class="rels">
        <div class="rel-row"><span class="tag">出现在</span>${occLinks}</div>
        ${synRow}
      </div>
    </div>`;
  });
  list.innerHTML = html;
  document.getElementById('empty').style.display = count? 'none':'block';
}

// 搜索
document.getElementById('q').addEventListener('input', e=> render(e.target.value));
// 过滤
document.querySelectorAll('.fbtn').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    curFilter = b.dataset.f;
    document.getElementById('hintmulti').textContent =
      curFilter==='cross' ? '⭐ 这些词在多篇文章里都出现过 —— 点篇目可直接跳过去对照' :
      curFilter==='syn' ? '这些词有近义/同义表达，点篇目看它们各自的语境' : '';
    render(document.getElementById('q').value);
  });
});

render('');
</script>
