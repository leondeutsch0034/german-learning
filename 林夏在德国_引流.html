// ═══════════════ 获取当前集数 ═══════════════
function getEp() {
  var m = location.search.match(/ep=(\d+)/);
  var ep = m ? parseInt(m[1]) : 1;
  if (!EP[ep]) ep = 1;
  return ep;
}

// ═══════════════ 渲染页面 ═══════════════
function render() {
  var ep = getEp();
  var d = EP[ep];

  // update title + meta
  document.title = '林夏在德国 - 第' + ep + '集 | ' + d.title + ' - Leon 德语';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.content = '第' + ep + '集：' + d.title + '。跟着23岁中国留学生林夏，走进真实的德国生活。A1-A2难度德语连续剧。';

  if (ogt) ogt.content = '林夏在德国 - 第' + ep + '集 | ' + d.title;

  if (ogd) ogd.content = '第' + ep + '集：' + d.title + '。跟着林夏走进真实德国生活。';
  var ogi = document.querySelector('meta[property="og:image"]');

  html += '<div class="vocab-tags">';

    html += '<div class="vt"><span class="vt-de">' + d.vocab[j][0] + '</span><span class="vt-zh">' + d.vocab[j][1] + '</span></div>';

(function lbDustInit(){
  var box = document.getElementById('lbDust');
  if (!box) return;
  var html = '';
  for (var i = 0; i < 24; i++) {
    var sz = (Math.random()*2.4 + 1).toFixed(1);
    var left = (Math.random()*52 + 2).toFixed(1);
    var top  = (Math.random()*70 + 12).toFixed(1);
    var dur  = (Math.random()*10 + 8).toFixed(1);
    var del  = (-Math.random()*18).toFixed(1);
    html += '<span class="lb-mote" style="width:'+sz+'px;height:'+sz+'px;left:'+left+'%;top:'+top+'%;--md:'+dur+'s;--mt:'+del+'s"></span>';
  }
  box.innerHTML = html;
})();

// ═══════════════ 启动 ═══════════════
render();
