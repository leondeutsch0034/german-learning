<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>发布包</title>
<style>
:root{--bg:#0a1428;--card:#10203c;--line:#1e3357;--txt:#e8eef7;--dim:#8ba1c4;--gold:#e0b356}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:16px/1.7 -apple-system,"PingFang SC",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;padding:0 0 env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}
h2{font-size:18px;margin:28px 0 4px;color:var(--gold)}
h3{font-size:17px;margin:0;font-weight:600}
.lead{color:var(--dim);font-size:14px}
.bar{position:sticky;top:0;z-index:9;display:flex;justify-content:space-between;
  align-items:center;background:rgba(10,20,40,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:10px 16px;font-size:14px;margin:-16px -16px 12px}
.bar b{color:var(--gold)}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;margin:14px 0}
.item.isdone{opacity:.45}
.item.isdone .imgs img{filter:grayscale(1)}
.imgs{display:flex;gap:2px;background:#000;flex-wrap:wrap}
.imgs a{flex:1 1 46%;min-width:46%;display:block}
.imgs img{width:100%;display:block;height:auto}
.body{padding:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.done{flex:none;font-size:14px;color:var(--dim);display:flex;align-items:center;gap:6px;
  background:#0a1428;border:1px solid var(--line);border-radius:20px;padding:6px 12px;white-space:nowrap}
.done input{width:18px;height:18px;accent-color:var(--gold)}
.use{font-size:14px;color:var(--dim);margin:6px 0 10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.blk{margin:12px 0}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.hd b{font-size:13px;color:var(--gold);font-weight:600}
.hd button{background:var(--gold);color:#0a1428;border:0;border-radius:8px;
  padding:6px 14px;font-size:14px;font-weight:600}
.bd{white-space:pre-wrap;word-break:break-word;background:#0a1428;border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font-size:15px}
.hint{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:20px 0}
.hint li{margin:6px 0;font-size:14px;color:var(--dim)}
.hint b{color:var(--txt)}
code{background:#0a1428;padding:1px 6px;border-radius:5px;color:var(--gold);font-size:13px}
#gate{max-width:360px;margin:18vh auto;text-align:center;padding:0 20px}
#gate h1{margin-bottom:24px}
#gate input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
  font-size:17px;padding:14px;border-radius:12px;text-align:center}
#gate button{width:100%;margin-top:12px;background:var(--gold);color:#0a1428;border:0;
  border-radius:12px;padding:14px;font-size:17px;font-weight:700}
#err{color:#ff8080;font-size:14px;height:20px;margin-top:10px}
</style></head>
<body>

<div class="wrap">
  <div id="app" hidden>
    <h1>发布包</h1>
    <div class="lead" id="upd"></div>
    <div class="bar"><span>已发：<b id="cnt">0 / 0</b></span>
      <button class="done" style="background:transparent;color:var(--dim)" onclick="resetDone()">清空勾选</button></div>
    <div id="list"></div>
    <div class="hint"><b>发之前每次都查这几条</b><ul>
      <li>图里、正文里没有网址 —— 搜 <code>.cn</code> <code>.com</code> <code>http</code> <code>leondeutsch</code></li>
      <li>评论区、主页简介不放联系方式（放一次就吃一次限流）</li>
      <li>小红书一天最多一条</li>
      <li>页面上是缩略图；点开图片再长按，存下来的才是原图</li>
    </ul></div>
  </div>

  <div id="gate">
    <h1>发布包</h1>
    <input id="pw" type="password" placeholder="口令" autocomplete="current-password">
    <button onclick="tryUnlock()">打开</button>
    <div id="err"></div>
  </div>
</div>

<script id="enc" type="application/json">{}</script>
<script>
var PWKEY='fashenme-web-pw', DONEKEY='fashenme-done-v1';
function b64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
async function deriveKey(pw,salt){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function unlock(pw){
  var enc=JSON.parse(document.getElementById('enc').textContent);
  var key=await deriveKey(pw,b64(enc.s));
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.i)},key,b64(enc.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function el(t,c){var e=document.createElement(t);if(c)e.className=c;return e}
function render(data){
  document.getElementById('upd').textContent='更新于 '+data.updated;
  var list=document.getElementById('list');
  data.sections.forEach(function(sec){
    var h=el('h2');h.textContent=sec.name;list.appendChild(h);
    if(sec.tag){var t=el('div','lead');t.textContent=sec.tag;list.appendChild(t)}
    sec.items.forEach(function(it){
      var card=el('div','item');card.dataset.k=it.key;
      if(it.imgs&&it.imgs.length){
        var im=el('div','imgs');
        it.imgs.forEach(function(f){
          var a=el('a');a.href='img/'+f.src;a.target='_blank';a.rel='noopener';
          var img=el('img');img.src='img/'+f.thumb;img.loading='lazy';img.decoding='async';img.alt='';
          a.appendChild(img);im.appendChild(a);
        });
        card.appendChild(im);
      }
      var body=el('div','body');
      var top=el('div','top');
      var hh=el('h3');hh.textContent=it.title;top.appendChild(hh);
      var lab=el('label','done');
      var cb=document.createElement('input');cb.type='checkbox';
      lab.appendChild(cb);lab.appendChild(document.createTextNode(' 已发'));
      top.appendChild(lab);body.appendChild(top);
      if(it.use){var u=el('p','use');u.textContent=it.use;body.appendChild(u)}
      (it.blocks||[]).forEach(function(b){
        var blk=el('div','blk');
        var hd=el('div','hd');var bb=el('b');bb.textContent=b.label;hd.appendChild(bb);
        var btn=document.createElement('button');btn.textContent='复制';btn.onclick=function(){cp(btn)};
        hd.appendChild(btn);blk.appendChild(hd);
        var bd=el('div','bd');bd.textContent=b.text;blk.appendChild(bd);
        body.appendChild(blk);
      });
      card.appendChild(body);list.appendChild(card);
    });
  });
  paint();
}
function cp(btn){
  var bd=btn.closest('.blk').querySelector('.bd'), t=bd.innerText;
  if(navigator.clipboard){navigator.clipboard.writeText(t).catch(fb)}else{fb()}
  function fb(){var r=document.createRange();r.selectNodeContents(bd);var s=getSelection();
    s.removeAllRanges();s.addRange(r);try{document.execCommand('copy')}catch(e){}s.removeAllRanges()}
  var o=btn.textContent;btn.textContent='已复制 ✓';setTimeout(function(){btn.textContent=o},1500);
}
function loadDone(){try{return JSON.parse(localStorage.getItem(DONEKEY)||'{}')}catch(e){return{}}}
function saveDone(o){try{localStorage.setItem(DONEKEY,JSON.stringify(o))}catch(e){}}
function paint(){
  var o=loadDone(),n=0,tot=0;
  document.querySelectorAll('.item').forEach(function(e){
    var k=e.dataset.k;if(!k)return;tot++;
    var cb=e.querySelector('input[type=checkbox]');cb.checked=!!o[k];
    e.classList.toggle('isdone',!!o[k]);if(o[k])n++;
  });
  var c=document.getElementById('cnt');if(c)c.textContent=n+' / '+tot;
}
document.addEventListener('change',function(e){
  if(e.target.matches('.done input')){
    var o=loadDone(),e2=e.target.closest('.item');o[e2.dataset.k]=e.target.checked;
    saveDone(o);paint();
  }
});
function resetDone(){if(confirm('清空所有勾选？')){saveDone({});paint()}}
function show(data){
  document.getElementById('gate').hidden=true;
  document.getElementById('app').hidden=false;
  render(data);
}
async function tryUnlock(){
  var pw=document.getElementById('pw').value, err=document.getElementById('err');
  err.textContent='';
  try{
    var data=await unlock(pw);
    try{sessionStorage.setItem(PWKEY,pw)}catch(e){}
    show(data);
  }catch(e){err.textContent='口令不对';}
}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlock()});
(function(){return;
  var saved=null;try{saved=sessionStorage.getItem(PWKEY)}catch(e){}
  if(saved){unlock(saved).then(show).catch(function(){try{sessionStorage.removeItem(PWKEY)}catch(e){}})}
  else{document.getElementById('pw').focus()}
})();
</script>
<script>show({"updated": "2026-10-17 19:55", "sections": [{"name": "📰 德语新闻 · 分级阅读（最新一期）", "tag": "一条笔记发 6 张 · A1/A2/B1/B2 四档 · 19:00–21:00", "items": [{"key": "news-15_火车站禁酒", "title": "15_火车站禁酒", "use": "一条笔记发这 6 张，按文件名顺序（第一张＝封面）。", "blocks": [{"label": "标题（3 选 1）", "text": "1. 德国火车站，10 月 15 日起全面禁酒\n2. 德语新闻｜德国车站，为什么突然不让喝酒了\n3. 一则德国新闻，写成 A1 到 B2 四个难度\n\n---"}, {"label": "正文", "text": "德国火车站，不让喝酒了 🍺🚫\n\n从 10 月 15 日起，德铁（Deutsche Bahn）在所有火车站禁止饮酒 —— 站台、大厅、通道，全算在内。\n\n车站里的餐厅和咖啡馆不受影响；买好的酒放行李里带走，也一直可以。\n\n我先摘一句 A1 版给你看：\n\nIn den Bahnhöfen darf man keinen Alkohol mehr trinken.\n火车站里不许再喝酒了。\n\n同一则新闻，我改成了四个难度，每一档都配中文对照 + 生词表 👇\n\n▪️ A1 —— 最短的句子，零基础也能读\n▪️ A2 —— 完整短句，加了连接词\n▪️ B1 —— 完整新闻报道的写法\n▪️ B2 —— 书面语的复杂结构（被动、分词定语、名词化）\n\n这期的词也很常用：\nder Bahnhof 火车站 · der Bahnsteig 站台 · das Alkoholverbot 禁酒令 · erlaubt / verboten 允许的／禁止的 · die Gastronomie 餐饮（业）\n\n其实读新闻是涨词汇最快的路子 —— 一个词这周在新闻里出现，下周又出现，想忘都难。而且不用背，读着读着就记住了。\n\n不管你现在是 A1 还是 B1，挑能读的那一档就行。读得下去，比读得难重要。\n\n每期一则德国新闻，持续更新 📚\n\n（前一期：德国人做了张「无障碍博物馆地图」）\n\n---"}, {"label": "话题标签", "text": "#德语学习 #德语 #德语阅读 #德国新闻 #歌德考试 #A1德语 #德语A2 #德语B1 #小语种学习 #德语打卡\n\n---"}, {"label": "置顶评论（自己发、置顶）", "text": "想看哪档？评论区回 A1 / A2 / B1 / B2，我告诉你该从哪一档开始读。\n\n---"}, {"label": "发布注意", "text": "- 首图必须是大字报封面，别换\n- 6 张按顺序发，生词表放最后（收藏钩子）\n- 正文里的德语例句是自己改写的，只取事实，不是逐句翻译外媒原文"}], "imgs": [{"src": "0d35e21078c8.jpg", "thumb": "_thumb/0d35e21078c8.jpg"}, {"src": "361931990470.jpg", "thumb": "_thumb/361931990470.jpg"}, {"src": "c6955698fdd9.jpg", "thumb": "_thumb/c6955698fdd9.jpg"}, {"src": "ec250e1abc8e.jpg", "thumb": "_thumb/ec250e1abc8e.jpg"}, {"src": "ca1f78699c4f.jpg", "thumb": "_thumb/ca1f78699c4f.jpg"}, {"src": "0b714c423345.jpg", "thumb": "_thumb/0b714c423345.jpg"}]}]}, {"name": "📅 待发队列", "tag": "按日期发 · 到点复制粘贴 · 共 26 条", "items": [{"key": "queue-20261017_bahnhof_alkoholverbot_news", "title": "2026-10-17 19:30 · bahnhof_alkoholverbot · news", "use": "一条笔记发这 6 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "德国火车站，10 月 15 日起全面禁酒"}, {"label": "标题 2（选一个）", "text": "德国所有火车站不让喝酒了，餐厅除外"}, {"label": "标题 3（选一个）", "text": "5.000 多个德国火车站，从今天起禁酒"}, {"label": "正文", "text": "从 2026 年 10 月 15 日起，德国铁路（Deutsche Bahn）在旗下**所有火车站禁止饮酒**——站台、大厅、通道都算。\n\n但有三个例外要记牢：\n\n① **车站里的餐厅和咖啡馆**不受影响，照样能喝；\n② 买来的酒放在**行李里带走**一直允许；\n③ 管的是「在哪喝」，不是「买不买」。\n\n联邦政府的禁毒专员 Hendrik Streeck 公开支持这条规定，说酒精会加剧争执和冲突。联邦警察的统计里，车站暴力犯罪约**三分之一**和酒精有关。\n\n学德语的话，这条新闻里有两个高频词要注意：das Alkoholverbot（禁酒令）、untersagt（被禁止，公文用词）。\n\n你觉得在火车站禁酒，是好事还是会过头？"}, {"label": "标签", "text": "#德语学习 #德语阅读 #德国文化 #德国生活 #德语词汇"}], "imgs": [{"src": "d4dd500f8fb1.jpg", "thumb": "_thumb/d4dd500f8fb1.jpg"}, {"src": "1b23b723ed3f.jpg", "thumb": "_thumb/1b23b723ed3f.jpg"}, {"src": "d45a8cbdf358.jpg", "thumb": "_thumb/d45a8cbdf358.jpg"}, {"src": "e51fd807fddd.jpg", "thumb": "_thumb/e51fd807fddd.jpg"}, {"src": "f527c7b91fe4.jpg", "thumb": "_thumb/f527c7b91fe4.jpg"}, {"src": "e67ef2ba636e.jpg", "thumb": "_thumb/e67ef2ba636e.jpg"}]}, {"key": "queue-20261018_bahnhof_alkoholverbot_theme", "title": "2026-10-18 19:30 · bahnhof_alkoholverbot · theme", "use": "一条笔记发这 1 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "车站不让喝酒，德国人吵起来了"}, {"label": "标题 2（选一个）", "text": "德国人为什么对「车站禁酒」这么敏感"}, {"label": "标题 3（选一个）", "text": "车站禁酒这件事，藏着两种德国"}, {"label": "正文", "text": "「火车站不许喝酒了」——一条公司规定，在德国能吵起来，你信吗？\n\n先说清楚规则（2026 年 10 月 15 日起）：\n\n· 德铁旗下**所有火车站**禁酒，站台、大厅都算\n· **餐厅和咖啡馆例外**，照样喝\n· 买来**放行李里带走**可以，只是别在站里开\n\n有意思的是：这不是法律，是德铁的 **Hausrecht（场所管理权）**——场地主人的规矩。违反的话，先是警告，然后请你离开，重犯就禁止进站。\n\n而在德国，这事儿敏感，因为啤酒在这里不只是饮料，是**社交**：啤酒花园、啤酒节、下班一杯……所以「公共场所不许喝」这句话，天然会踩到一些人。\n\n一边是对啤酒的宽容传统，一边是公共场所越来越强调「安全和秩序」——这条禁令，正好卡在这两种德国中间。\n\n你觉得在车站禁酒，是进步，还是管太宽？"}, {"label": "标签", "text": "#德语学习 #德语阅读 #德国文化 #德国生活 #德国人"}], "imgs": [{"src": "f53ebc8c3656.jpg", "thumb": "_thumb/f53ebc8c3656.jpg"}]}, {"key": "queue-20261019_mehlschwalbe_news", "title": "2026-10-19 19:30 · mehlschwalbe · news", "use": "一条笔记发这 6 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "一只燕子当选了 2027 年度鸟"}, {"label": "标题 2（选一个）", "text": "14.8 万德国人投票，选出了这只燕子"}, {"label": "标题 3（选一个）", "text": "德国 2027 年度鸟：毛脚燕"}, {"label": "正文", "text": "德国每年都会评「年度鸟类」。2027 年的结果 10 月 15 日公布：**毛脚燕（Mehlschwalbe）**赢了。\n\n超过 **14.8 万人**线上投票，毛脚燕拿了 67.050 票、约 **45,2%**，明显领先其他四名候选。\n\n它长什么样、住哪儿？\n· 一种小燕子，腰腹白得像面粉（名字 Mehl 就是这么来的）\n· 在**屋檐下**用泥土垒一个圆窝，一个窝最多要 **1.500 粒泥球**，一口口衔回来粘上\n· 是**候鸟**：冬天飞几千公里去非洲，四月初回来繁殖\n\n但也正因为这样，它现在很难：很多人嫌脏，把窝移走或毁掉；昆虫越来越少，它没得吃。红色名录已经把它列为**受威胁**。\n\n（冷知识：毛脚燕 1974 年就当过一次年度鸟。）\n\n你见过屋檐下的燕子窝吗？"}, {"label": "标签", "text": "#德语学习 #德语阅读 #德国文化 #德国生活 #自然"}], "imgs": [{"src": "889135aecbeb.jpg", "thumb": "_thumb/889135aecbeb.jpg"}, {"src": "44298b745bd7.jpg", "thumb": "_thumb/44298b745bd7.jpg"}, {"src": "f7f66c9f3fa3.jpg", "thumb": "_thumb/f7f66c9f3fa3.jpg"}, {"src": "e3c12e9e2a77.jpg", "thumb": "_thumb/e3c12e9e2a77.jpg"}, {"src": "2ea35b754eaa.jpg", "thumb": "_thumb/2ea35b754eaa.jpg"}, {"src": "eed0ab761a40.jpg", "thumb": "_thumb/eed0ab761a40.jpg"}]}, {"key": "queue-20261020_mehlschwalbe_theme", "title": "2026-10-20 19:30 · mehlschwalbe · theme", "use": "一条笔记发这 1 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "屋檐下那个窝，房东让我别碰"}, {"label": "标题 2（选一个）", "text": "为什么德国房东不让人动燕子窝"}, {"label": "标题 3（选一个）", "text": "一只燕子当选年度鸟，德国人认真了"}, {"label": "正文", "text": "搬进德国新租的房子，房东太太指着门上方那排小泥碗说：**别碰，那是燕子窝。**\n\n在德国，弄掉燕子窝是**违法**的——燕子是受保护物种。但现实里，还是有很多人嫌脏，把窝移走或毁掉。\n\n2027 年的「年度鸟类」刚选出来，就是这只燕子：**毛脚燕**。14.8 万人投票，它拿了约 45%。\n\n关于它，几个看完会记住的点：\n\n· 一个窝最多用 **1.500 粒泥球**，得去水坑边一口口衔，再用唾液粘起来\n· 它是**候鸟**，冬天飞几千公里去非洲，四月初回来\n· 名字里的 Mehl（面粉），来自它白得像面粉的腰腹\n· 它越来越少的原因很具体：**窝被弄掉 ＋ 昆虫变少**\n\n普通人能做的其实很小：让窝留着，院子里留一块泥水坑，花园别把虫子打光。\n\n在「整洁」和「给野东西留块地方」之间，德国人也在纠结。\n\n你家屋檐下，有没有住过一窝燕子？"}, {"label": "标签", "text": "#德语学习 #德语阅读 #德国文化 #德国生活 #自然保护"}], "imgs": [{"src": "0991efaff103.jpg", "thumb": "_thumb/0991efaff103.jpg"}]}, {"key": "queue-20261021_jugendsprache_theme", "title": "2026-10-21 19:30 · jugendsprache · theme", "use": "一条笔记发这 1 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "德国年度青少年词，一连七年是英语"}, {"label": "标题 2（选一个）", "text": "Digga、Schere、67：德国年轻人到底在说什么"}, {"label": "标题 3（选一个）", "text": "德语里最「不像德语」的七个年度词"}, {"label": "正文", "text": "德国每年选一个「年度青少年词汇」。2026 年的赢家是 Ragebait——而往回数，2020 到 2026 连着七年，赢家全是英语借词：\n\nlost → cringe → smash → goofy → Aura → Das crazy → Ragebait\n\n再往前（2017 的 I bims、2018 的 Ehrenmann）还都是德语的。\n\n今年 Top 10 里还有几个很典型的：\n\n· **Digga** —— 汉堡来的称呼，等于「哥们儿」，不是骂人胖\n· **Schere** —— 游戏圈的说法，意思是「我的锅」\n· **67** —— 万能词，本身没有任何意思\n· **Macker** —— 男朋友／那小子，常带调侃\n· **Gute Käse** —— 故意不合语法（本该是 guter Käse）\n\n这些词的共同点不是意思，是来路：哪里火，词就从哪里来。\n\n你听过哪个？"}, {"label": "标签", "text": "#德语学习 #德语口语 #德国文化 #Jugendsprache #青少年俚语"}], "imgs": [{"src": "9f3291a687a8.jpg", "thumb": "_thumb/9f3291a687a8.jpg"}]}, {"key": "queue-20261022_optogenetik_news", "title": "2026-10-22 19:30 · optogenetik · news", "use": "一条笔记发这 6 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "两个德国人拿了诺贝尔医学奖，靠的是一束光"}, {"label": "标题 2（选一个）", "text": "用蓝光就能开关一个脑细胞？2026 诺贝尔医学奖"}, {"label": "标题 3（选一个）", "text": "这个诺贝尔奖的方法，是从一种藻类借来的"}, {"label": "正文", "text": "2026 年诺贝尔医学奖 10 月 5 日公布，颁给了光遗传学的三位开创者：\n\n🇩🇪 Peter Hegemann（柏林洪堡大学）\n🇩🇪 Georg Nagel（维尔茨堡大学）\n🇺🇸 Karl Deisseroth（斯坦福大学）\n\n原理其实很好懂：他们在一种**单细胞藻类**里找到了一种对光敏感的蛋白，把它装进神经细胞——于是**用蓝光就能把细胞打开或关掉**。\n\n三位平分 1200 万瑞典克朗（约 100 万欧元），12 月 10 日在斯德哥尔摩颁奖。\n\n学德语的话，Optogenetik 这个词本身就有意思：Optik（光学）＋ Genetik（遗传学），典型的德语拼词。\n\n你觉得「用光控制大脑」这件事，科幻还是现实？"}, {"label": "标签", "text": "#德语学习 #德语阅读 #德国文化 #诺贝尔奖 #光遗传学"}], "imgs": [{"src": "631fcc8267eb.jpg", "thumb": "_thumb/631fcc8267eb.jpg"}, {"src": "e3f49f4932a6.jpg", "thumb": "_thumb/e3f49f4932a6.jpg"}, {"src": "543d019c76e3.jpg", "thumb": "_thumb/543d019c76e3.jpg"}, {"src": "952d11668681.jpg", "thumb": "_thumb/952d11668681.jpg"}, {"src": "038eff273ca9.jpg", "thumb": "_thumb/038eff273ca9.jpg"}, {"src": "4612375cb10a.jpg", "thumb": "_thumb/4612375cb10a.jpg"}]}, {"key": "queue-20261023_optogenetik_theme", "title": "2026-10-23 19:30 · optogenetik · theme", "use": "一条笔记发这 1 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "用一束光，开关一个脑细胞"}, {"label": "标题 2（选一个）", "text": "新闻德语和日常德语，差得到底有多大"}, {"label": "标题 3（选一个）", "text": "Optogenetik：一个词看懂德语拼词法"}, {"label": "正文", "text": "「用一束光控制一个神经细胞」——这不是科幻，是今年诺贝尔医学奖的成果：光遗传学（Optogenetik）。\n\n有意思的是这个名字本身：**Optik（光学）＋ Genetik（遗传学）**，德语把两个词直接粘在一起，意思就出来了。\n\n而讲这件事的**新闻德语**，和我们平时学的日常德语差得不小：\n\n· 口语：Die haben was mit Licht im Gehirn gemacht.\n  新闻：Sie haben Nervenzellen mithilfe von Licht gesteuert.\n\n· 口语：Der hat den Preis gekriegt.\n  新闻：Er wurde mit dem Nobelpreis ausgezeichnet.\n\n看出来了吗？新闻德语爱用**被动态**——把动作放前面，谁做的往后放，甚至不说。\n\n你读德语新闻时，最卡的是哪种句子？"}, {"label": "标签", "text": "#德语学习 #德语阅读 #德国文化 #科学德语 #德语语法"}], "imgs": [{"src": "5a1642c154ad.jpg", "thumb": "_thumb/5a1642c154ad.jpg"}]}, {"key": "queue-20261024_freundschaftsvertrag_news", "title": "2026-10-24 19:30 · freundschaftsvertrag · news", "use": "一条笔记发这 6 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "脱欧六年后，英国和德国签了份「友好条约」"}, {"label": "标题 2（选一个）", "text": "英德签了友好条约，学生互相免签"}, {"label": "标题 3（选一个）", "text": "德国和英国，计划开通直达火车"}, {"label": "正文", "text": "英国脱欧六年多之后，德国和英国在柏林让一份「友好条约」正式生效。\n\n它叫 **Kensington-Vertrag**——因为 2025 年 7 月是在伦敦的**肯辛顿区**签的，2026 年 10 月 8 日才在柏林互换批准书、正式生效。\n\n里面最实在的两条：\n🎒 班级旅行去对方国家，**不用签证**了\n🚄 计划开通**直达火车**（目前柏林—伦敦要换乘）\n\n其他还有防务、经济、打击跨境犯罪、遏制非法移民，以及一整套科技合作。\n\n顺带一个德语点：「生效」是 **in Kraft treten**，字面是「进入效力」。\n\n你觉得柏林—伦敦直达火车，真能开起来吗？"}, {"label": "标签", "text": "#德语学习 #德语阅读 #德国文化 #英国 #德语新闻"}], "imgs": [{"src": "2b8ee196e9f9.jpg", "thumb": "_thumb/2b8ee196e9f9.jpg"}, {"src": "f3f50f946ea2.jpg", "thumb": "_thumb/f3f50f946ea2.jpg"}, {"src": "d26024dade48.jpg", "thumb": "_thumb/d26024dade48.jpg"}, {"src": "4b83546ee6d9.jpg", "thumb": "_thumb/4b83546ee6d9.jpg"}, {"src": "6d768d4f8242.jpg", "thumb": "_thumb/6d768d4f8242.jpg"}, {"src": "4d50bdbfc7a8.jpg", "thumb": "_thumb/4d50bdbfc7a8.jpg"}]}, {"key": "queue-20261025_freundschaftsvertrag_theme", "title": "2026-10-25 19:30 · freundschaftsvertrag · theme", "use": "一条笔记发这 1 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "脱欧六年后，英国和德国签了友好条约"}, {"label": "标题 2（选一个）", "text": "同一句话，日常德语和外交德语差多远"}, {"label": "标题 3（选一个）", "text": "in Kraft treten：德语「生效」怎么说"}, {"label": "正文", "text": "德国和英国刚让一份「友好条约」正式生效。但更有意思的是——**同一件事，日常德语和外交德语完全两个说法**：\n\n· 日常：Der Vertrag gilt jetzt.\n  外交：Der Vertrag ist in Kraft getreten.（条约已生效）\n\n· 日常：Sie tauschen Papiere aus.\n  外交：Sie tauschen die Ratifizierungsurkunden aus.（互换批准书）\n\n· 日常：Schüler brauchen kein Visum mehr.\n  外交：Für Klassenfahrten entfällt die Visumpflicht.（取消签证义务）\n\n规律有两个：\n① 固定搭配要背——「生效」永远是 **in Kraft treten**，不是「funktionieren」\n② 德语公文爱**名词化**：eindämmen（遏制）→ die Eindämmung\n\n看到 -ung 结尾的长名词，试着还原成动词，句子立刻变简单。\n\n你读德语新闻时最怕哪种长句？"}, {"label": "标签", "text": "#德语学习 #德语阅读 #德国文化 #德语语法 #外交"}], "imgs": [{"src": "1effe8d08d9f.jpg", "thumb": "_thumb/1effe8d08d9f.jpg"}]}, {"key": "queue-20261026_seenotrettung_theme", "title": "2026-10-26 19:30 · seenotrettung · theme", "use": "一条笔记发这 1 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "海上救人，德国这支队伍不拿国家一分钱"}, {"label": "标题 2（选一个）", "text": "德国海上救援队：160 年，只靠捐款"}, {"label": "标题 3（选一个）", "text": "别人往回开的时候，他们往外开"}, {"label": "正文", "text": "一个人在太平洋上漂了三天，最后被军舰救起——这条新闻本身不长，但顺着问一句「谁来救人、谁出钱」，会撞到德国一个很特别的制度。\n\n德国的海上救援队 **DGzRS**（Die Seenotretter）：\n\n🌊 1865 年成立，管德国北海和波罗的海，53–54 个站点\n💰 **只靠捐款**——而且是**有意**不要国家拨款，怕不独立\n🚤 全国约 13,000 个「捐款小船」（Sammelschiffchen）募捐箱，1875 年就有了\n🙋 约 1,000 名救援人员，其中 **800 多人是志愿者**\n📊 2025 年出动 1,723 次，帮助 3,389 人\n\n形容他们的一句话：**别的船往港里开的时候，他们往港外开。**\n\n顺带一个德语词：**ehrenamtlich**（义务的、不拿钱的）——德国的消防队、体育协会、救援队都靠这个词撑着。\n\n你觉得「救人不要国家的钱」这件事，是理想还是冒险？"}, {"label": "标签", "text": "#德语学习 #德语阅读 #德国文化 #德国冷知识 #海上救援"}], "imgs": [{"src": "cf8403b45491.jpg", "thumb": "_thumb/cf8403b45491.jpg"}]}, {"key": "queue-20261027_deutschlandticket_news", "title": "2026-10-27 19:30 · deutschlandticket · news", "use": "一条笔记发这 6 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "德国那张「全国月票」，明年要 66,80 欧了"}, {"label": "标题 2（选一个）", "text": "一张票坐遍全德国，为什么一直在涨价"}, {"label": "标题 3（选一个）", "text": "49 → 58 → 63 → 66,80：德国票四年涨了三次"}, {"label": "正文", "text": "在德国待过的都认识它：**Deutschlandticket**，一张月票坐遍全德国的公交、地铁、区域火车。\n\n价格表是这样的：\n\n· 2023 年 5 月　49 欧\n· 2025 年 1 月　58 欧\n· 2026 年 1 月　63 欧\n· **2027 年 1 月 1 日　66,80 欧**\n\n涨 3,80 欧，约 6%。同期工作票 63,46 欧、学期票 40,08 欧一起调。\n\n为什么一直涨？因为**联邦和各州各出 15 亿欧元的补贴，被冻结到 2030 年不变**。补贴不涨、成本在涨，差额就进了票价——而且从 2027 年起，价格是按一个**成本指数自动算**的。\n\n⚠️ 一个常见误区：德国票**不能坐 ICE**（城际快车）。它只覆盖近程交通。\n\n你在德国时买过这张票吗？月票和单程票你更常用哪个？"}, {"label": "标签", "text": "#德语学习 #德国生活 #德国留学 #公共交通 #Deutschlandticket"}], "imgs": [{"src": "b68f2bf8d877.jpg", "thumb": "_thumb/b68f2bf8d877.jpg"}, {"src": "478b41e989b4.jpg", "thumb": "_thumb/478b41e989b4.jpg"}, {"src": "37c3e740078a.jpg", "thumb": "_thumb/37c3e740078a.jpg"}, {"src": "b156dc75c937.jpg", "thumb": "_thumb/b156dc75c937.jpg"}, {"src": "1fea8ab609ad.jpg", "thumb": "_thumb/1fea8ab609ad.jpg"}, {"src": "4ec32fd76eb8.jpg", "thumb": "_thumb/4ec32fd76eb8.jpg"}]}, {"key": "queue-20261028_deutschlandticket_theme", "title": "2026-10-28 19:30 · deutschlandticket · theme", "use": "一条笔记发这 1 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "一张月票，坐遍全德国"}, {"label": "标题 2（选一个）", "text": "德国人怎么买票：售票机上的那几句德语"}, {"label": "标题 3（选一个）", "text": "ab dem 1. Januar：一个介词看懂德语日期"}, {"label": "正文", "text": "在德国坐车，绕不开这三件事：**买票、查票、涨价**。\n\n🎫 **德国票（Deutschlandticket）** 一张月票坐遍全国——但有边界：\n区域火车 RE/RB、S-Bahn、U-Bahn、有轨电车、公交都行，**ICE 不行**。\n\n课本德语和售票机上的德语，差得不小：\n\n· 课本：Ich kaufe eine Monatskarte für den öffentlichen Nahverkehr.\n  日常：Ich hol mir das Deutschlandticket.\n\n· 课本：Der Preis für das Ticket wurde erhöht.\n  日常：Das Ticket ist schon wieder teurer geworden.\n\n· 课本：Der Preis ist relativ hoch.\n  日常：Ganz schön happig, oder?\n\n再送一个语法点：**ab＋第三格**表示「从…起」——\n*Ab dem 1. Januar 2027 kostet es 66,80 Euro.*\n\n你在德国售票机上卡过壳吗？"}, {"label": "标签", "text": "#德语学习 #德语口语 #德国生活 #公共交通 #德语语法"}], "imgs": [{"src": "ca0091f482f1.jpg", "thumb": "_thumb/ca0091f482f1.jpg"}]}, {"key": "queue-20261029_cybermobbing_news", "title": "2026-10-29 19:30 · cybermobbing · news", "use": "一条笔记发这 6 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "每 5 个德国学生，就有 1 个在网上被骂"}, {"label": "标题 2（选一个）", "text": "德国新研究：近 240 万孩子遭遇过网络霸凌"}, {"label": "标题 3（选一个）", "text": "网络霸凌的攻击者，90% 就在同一所学校"}, {"label": "正文", "text": "德国「反网络霸凌联盟」刚发布的 Cyberlife VI 研究，数字有点吓人：\n\n📱 每 5 个德国学生里，就有 1 个在网上被辱骂或攻击过——接近 **240 万人**。\n🏫 超过 **90%** 的攻击，发生在**学校环境**里。\n👥 大多数受害者**认识**施暴者——常常就是同班同学。\n📲 战场主要在 WhatsApp、TikTok、Instagram。\n\n也就是说：网络霸凌的根，通常在教室里，而不在匿名网络上。\n\n联盟还警告一件事：现在用 AI，几秒钟就能生成一张侮辱性的图片，伤害的成本更低了。所以他们要求德国为网络霸凌立一部**专门的法律**。\n\n学德语的话，这一期能带走几个词：das Cyber-Mobbing（网络霸凌）、das Opfer（受害者）、der Täter（施暴者）、beleidigen（辱骂）。\n\n你上学时，遇到过类似的事吗？"}, {"label": "标签", "text": "#德语学习 #德语阅读 #德国教育 #网络霸凌 #德国生活"}], "imgs": [{"src": "7255d8be9af2.jpg", "thumb": "_thumb/7255d8be9af2.jpg"}, {"src": "928464c44b21.jpg", "thumb": "_thumb/928464c44b21.jpg"}, {"src": "5103254670b7.jpg", "thumb": "_thumb/5103254670b7.jpg"}, {"src": "bb4b23e5d563.jpg", "thumb": "_thumb/bb4b23e5d563.jpg"}, {"src": "f1bc950d6fb7.jpg", "thumb": "_thumb/f1bc950d6fb7.jpg"}, {"src": "667eedada02d.jpg", "thumb": "_thumb/667eedada02d.jpg"}]}, {"key": "queue-20261030_cybermobbing_theme", "title": "2026-10-30 19:30 · cybermobbing · theme", "use": "一条笔记发这 1 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "每 5 个德国学生就有 1 个在网上被骂"}, {"label": "标题 2（选一个）", "text": "德国人为「网络霸凌」想立一部专门法"}, {"label": "标题 3（选一个）", "text": "德语怎么表达「被欺负」？man 的用法"}, {"label": "正文", "text": "「每 5 个学生就有 1 个在网上被骂」——这不只是德国的数字，也是手机进校园后，很多国家的共同难题。\n\n德国人的处理方式，有几层值得看看：\n\n⚖️ **法律**：辱骂本身可追责（德国刑法第 185 条），但「一群人在群里一人一句」的单条都不算重，合起来才伤人——所以难追究。联盟因此主张**立专门法**。\n\n🏫 **学校**：主要靠预防。把「媒介素养」（Medienkompetenz）排进课，班里设**议事会**（Klassenrat），让冲突先在班上说开。\n\n👨👩👧 **家长**：联盟特别提醒别只说「别理它」——手机是孩子的社交入口，「不理」约等于把人从圈子里推开。\n\n顺便记一个德语语法点：**man** 表示「人们 / 大家」，后面的动词永远用第三人称单数——„Das nennt **man** Cyber-Mobbing.“（人们把它叫作网络霸凌。）\n\n你会怎么跟孩子聊「网上被欺负」这件事？"}, {"label": "标签", "text": "#德语学习 #德语阅读 #德国文化 #德语语法 #德国教育"}], "imgs": [{"src": "c7c2fa5aa6d7.jpg", "thumb": "_thumb/c7c2fa5aa6d7.jpg"}]}, {"key": "queue-20261031_rente_news", "title": "2026-10-31 19:30 · rente · news", "use": "一条笔记发这 6 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "德国人退休每月拿多少？男女差了 455 欧"}, {"label": "标题 2（选一个）", "text": "德国养老金又涨了 4,24%，为什么还是不够"}, {"label": "标题 3（选一个）", "text": "同岁、同国：德国男人 1451 欧，女人 913 欧"}, {"label": "正文", "text": "2026 年 7 月起，德国养老金**上调 4,24%**。但平均下来，差距大得有点刺眼：\n\n💰 **西部男性约 1.451 欧/月**\n💰 **西部女性约 913 欧/月**（差 455 欧）\n💰 有意思的是，**东部女性约 1.325 欧**，反而比西部高\n\n算法其实很简单：\n· 缴的每一年、每一档工资 → 折成**积分**\n· 积分 × **42,52 欧**（2026 年的单位值）= 月养老金\n· 想提前退：**每提前 1 个月扣 0,3%**，最多扣 14,4%\n· 缴满 **45 年**可以无扣减提前退\n\n钱从哪来？**缴费率 18,6%**，雇员雇主各一半。而社会在变老——2026 年已有约 **2100 万**退休者，缴费率 **2028 年起要涨**。\n\n难怪 61% 的德国人觉得改革方案不公平。\n\n你觉得这种「缴得多拿得多」的制度，公平吗？\n\n#德语学习 #德语阅读 #德国养老金 #德国生活 #德国冷知识"}, {"label": "标签", "text": "#德语学习 #德语阅读 #德国养老金 #德国生活 #德国冷知识"}], "imgs": [{"src": "b65191221fcb.jpg", "thumb": "_thumb/b65191221fcb.jpg"}, {"src": "25318f7d8723.jpg", "thumb": "_thumb/25318f7d8723.jpg"}, {"src": "e2ee5f18e32e.jpg", "thumb": "_thumb/e2ee5f18e32e.jpg"}, {"src": "a65d9f0a82a6.jpg", "thumb": "_thumb/a65d9f0a82a6.jpg"}, {"src": "4ee10403815c.jpg", "thumb": "_thumb/4ee10403815c.jpg"}, {"src": "9bf502c6c7f7.jpg", "thumb": "_thumb/9bf502c6c7f7.jpg"}]}, {"key": "queue-20261101_rente_theme", "title": "2026-11-01 19:30 · rente · theme", "use": "一条笔记发这 1 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "德国人几岁退休？答案是 64,7 岁"}, {"label": "标题 2（选一个）", "text": "德国养老金：涨了 4,24%，还是不够"}, {"label": "标题 3（选一个）", "text": "德语里「我退休了」怎么说？课本和日常不一样"}, {"label": "正文", "text": "德国法定退休年龄是 **67 岁**——但 **2026 年实际平均退休年龄只有 64,7 岁**。\n大多数人其实没熬到 67 就退了，代价是**每提前 1 个月扣 0,3%**。\n\n三个数字记住德国养老金：\n🕖 **67** —— 法定退休年龄\n⚖️ **18,6%** —— 缴费率，雇员雇主各一半\n📉 **48%** —— 养老金水平（相对平均工资），保到 2031 年\n\n还有一组最扎心的数：\n· 西部男性平均 **1.451 欧/月**\n· 西部女性平均 **913 欧/月**\n· 东部女性反而高点：**1.325 欧/月**\n\n德语小知识：说「我退休了」，课本教你 *Ich bin in Rente.*，\n日常更常听到 *Ich bin Rentner.*——一个说状态，一个说人。\n\n#德语学习 #德语口语 #德国养老金 #德国生活 #德语"}, {"label": "标签", "text": "#德语学习 #德语口语 #德国养老金 #德国生活 #德语"}], "imgs": [{"src": "de60350f0706.jpg", "thumb": "_thumb/de60350f0706.jpg"}]}, {"key": "queue-20261102_gehalt_news", "title": "2026-11-02 19:30 · gehalt · news", "use": "一条笔记发这 6 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "德国月薪 4850 欧，到手只剩 3053？"}, {"label": "标题 2（选一个）", "text": "德国工资单中间那串数字，到底是什么"}, {"label": "标题 3（选一个）", "text": "德语里报工资，为什么一定要问 brutto 还是 netto"}, {"label": "正文", "text": "德国全职平均毛月薪约 **4.850 欧**——但真正打到卡上的只有约 **3.053 欧**。\n\n中间那 **37%** 被谁拿走了？\n\n💰 **税（Steuern）**\n· 起始税率 14%，最高 42%（约 68.429 欧起）\n· 2026 年基本免税额：**12.084 欧/年**\n· 团结附加税：约 90% 的人已免\n\n⚖️ **社保（Sozialabgaben）**，雇员部分合计约 **21%**\n· 养老 9,3% ｜ 医保 7,3%（+附加费）\n· 护理 1,7%（无子女 2,4%）｜ 失业 1,3%\n\n三个容易搞错的点：\n① **平均≠典型**：毛年薪平均 64.441 欧，但**中位数只有 54.066 欧**\n② **不是全按 42% 缴**：是分段累进，平均收入者实际总负担约 33–37%\n③ **税级影响很大**：单身、已婚、单亲，同样毛工资到手能差几百欧\n\n德语小知识：这里没人只报一个数——第一句一定问\n**„Brutto oder netto?“**（毛的净的？）\n\n#德语学习 #德语阅读 #德国工资 #德国生活 #德语"}, {"label": "标签", "text": "#德语学习 #德语阅读 #德国工资 #德国生活 #德语"}], "imgs": [{"src": "442c26cadcd8.jpg", "thumb": "_thumb/442c26cadcd8.jpg"}, {"src": "361d7366c6a8.jpg", "thumb": "_thumb/361d7366c6a8.jpg"}, {"src": "6bfbcb5b0675.jpg", "thumb": "_thumb/6bfbcb5b0675.jpg"}, {"src": "445bcd4eb4da.jpg", "thumb": "_thumb/445bcd4eb4da.jpg"}, {"src": "df1487399da2.jpg", "thumb": "_thumb/df1487399da2.jpg"}, {"src": "1e92151ee175.jpg", "thumb": "_thumb/1e92151ee175.jpg"}]}, {"key": "queue-20261103_gehalt_theme", "title": "2026-11-03 19:30 · gehalt · theme", "use": "一条笔记发这 1 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "德语报工资，为什么必须问 brutto 还是 netto"}, {"label": "标题 2（选一个）", "text": "德国工资单：4.850 欧是怎么变成 3.053 的"}, {"label": "标题 3（选一个）", "text": "Brutto 和 Netto 差在哪？德国人天天要区分"}, {"label": "正文", "text": "德语里「工资」是**两个词**，不是一个：\n\n💶 **Brutto** = 税前，扣之前\n💶 **Netto** = 到手，打到卡上的\n\n平均收入者（4.850 欧毛）到手约 **3.053 欧**，差了 **37%**。\n所以德国人聊工资一定会说清是哪个——只报一个数，对方第一句一定是：\n**„Brutto oder netto?“**\n\n德语小知识，直接能用：\n· 课本说 *Ich verdiene 3.000 Euro brutto.*\n· 口语更常说 *Ich hab' 3.000 brutto.*\n· 「到手多少？」最地道的是 *Was kommt bei dir raus?*\n\n（正式场合才用 *Nettogehalt*：银行、合同、面试。）\n\n#德语学习 #德语口语 #德国工资 #德国生活 #德语"}, {"label": "标签", "text": "#德语学习 #德语口语 #德国工资 #德国生活 #德语"}], "imgs": [{"src": "f9ac42a1de58.jpg", "thumb": "_thumb/f9ac42a1de58.jpg"}]}, {"key": "queue-20261104_mietpreise_news", "title": "2026-11-04 19:30 · mietpreise · news", "use": "一条笔记发这 6 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "慕尼黑房租 23 欧一平米，还只是冷租？"}, {"label": "标题 2（选一个）", "text": "德国租房为什么分「冷租」和「暖租」"}, {"label": "标题 3（选一个）", "text": "在慕尼黑，一平米房子一个月多少钱"}, {"label": "正文", "text": "在慕尼黑，一个平米的**冷租**平均超过 **23 欧**——而这只是房子本身的价。\n\n德国租房账单要拆开看：\n❄️ **Kaltmiete 冷租** = 房子本身\n🔥 **Nebenkosten 附加费** ≈ **4 欧/㎡**（暖气、水、垃圾、楼管）\n🌡️ **Warmmiete 暖租** = 两者相加 ≈ **27,42 欧/㎡**\n\n所以一套 50 平的房子：\n· 冷租约 **1.170 欧**\n· 暖租直接上 **1.370 欧**左右\n· 押金还是**三个月冷租 = 3.510 欧**\n\n最容易被单一数字骗的地方：\n📉 老合同（存续租约）可能只要 **16 欧/㎡**\n📈 新挂牌能到 **25–29 欧/㎡**\n📍 城区差一倍：Feldmoching 14,80 ↔ Altstadt-Lehel 28,50\n\n还有一道「**租金刹车**」（Mietpreisbremse）：新租最多超出当地可比租金 10%。\n⚠️ 但**新建房**和**带家具房**不受限——这就是慕尼黑房源越来越爱写「möbliert」的原因。\n\n#德语学习 #德语阅读 #德国租房 #慕尼黑 #德国生活"}, {"label": "标签", "text": "#德语学习 #德语阅读 #德国租房 #慕尼黑 #德国生活"}], "imgs": [{"src": "50c8baced5e5.jpg", "thumb": "_thumb/50c8baced5e5.jpg"}, {"src": "30c6df470202.jpg", "thumb": "_thumb/30c6df470202.jpg"}, {"src": "0128bca8a280.jpg", "thumb": "_thumb/0128bca8a280.jpg"}, {"src": "2f071e6ae5ba.jpg", "thumb": "_thumb/2f071e6ae5ba.jpg"}, {"src": "2f0acae90373.jpg", "thumb": "_thumb/2f0acae90373.jpg"}, {"src": "1f1ffa2ea238.jpg", "thumb": "_thumb/1f1ffa2ea238.jpg"}]}, {"key": "queue-20261105_mietpreise_theme", "title": "2026-11-05 19:30 · mietpreise · theme", "use": "一条笔记发这 1 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "德语租房：为什么每个人都问你 kalt oder warm"}, {"label": "标题 2（选一个）", "text": "德国租房账单上的四个词，一次讲清"}, {"label": "标题 3（选一个）", "text": "慕尼黑看房现场：报价之后，还有一句「但是」"}, {"label": "正文", "text": "德国人报房租，**默认一定会说清是冷是暖**——\n不然对方第一句一定是：**kalt oder warm?**（冷还是暖？）\n\n四个词读懂德国租房账单：\n❄️ **Kaltmiete** 冷租 = 房子本身\n🔥 **Nebenkosten** 附加费 = 暖气水垃圾 ≈ 4 欧/㎡\n🌡️ **Warmmiete** 暖租 = 冷 + 附加\n💰 **Kaution** 押金 = 通常**三个月冷租**\n\n德语小知识，直接能用：\n· 合同上写 *Die Nettokaltmiete beträgt 800 Euro.*\n· 口语只说 *Kalt sind's 800.*\n· 「你房租多少？」→ *Was zahlst du Miete?*（比 Wie hoch ist… 自然）\n\n（正式约看房用 *besichtigen*；跟朋友说 *Kann ich mal reinschauen?*）\n\n#德语学习 #德语口语 #德国租房 #德国生活 #德语"}, {"label": "标签", "text": "#德语学习 #德语口语 #德国租房 #德国生活 #德语"}], "imgs": [{"src": "0ef79872ea92.jpg", "thumb": "_thumb/0ef79872ea92.jpg"}]}, {"key": "queue-20261106_krankenversicherung_news", "title": "2026-11-06 19:30 · krankenversicherung · news", "use": "一条笔记发这 6 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "德国医保涨到 17,5%，史上最高"}, {"label": "标题 2（选一个）", "text": "在德国看病不花钱？看看你的工资单再说"}, {"label": "标题 3（选一个）", "text": "德国医保的附加费，为什么每家都不一样"}, {"label": "正文", "text": "2026 年起，德国法定医保的平均缴费率涨到 **17,5%**——史上最高。\n\n拆开看：\n📌 **一般费率 14,6%**（雇主雇员各 7,3%）\n📌 **附加费 2,9%**（2025 年还是 2,5%）\n📌 合计 **17,5%**\n\n**月薪 2.000 欧 → 每月缴约 175 欧**。\n（雇主还要再掏差不多的一半。）\n\n三个容易搞错的点：\n① **2,9% 只是全国平均**——每家医保机构**自己定**附加费，\n   所以同样工资，换一家缴的钱不一样。德国人可以**随时换机构**省钱。\n② **GKV 和 PKV 是两条路**：法定医保按**收入**缴；私营医保按**年龄/风险**，保费会随年龄涨。\n   2026 年约 **60% 的 PKV 投保人**面临平均 **13%** 的涨价。\n③ **看病当场不付钱**——出示医保卡，诊所直接和医保结算。但部分药品要自付（Zuzahlung）。\n\n德语小知识：请病假要开的证明全称长得吓人——\n*Arbeitsunfähigkeitsbescheinigung*，但德国人全都只说 **der gelbe Schein**（黄单子）。\n\n#德语学习 #德语阅读 #德国医保 #德国生活 #德国冷知识"}, {"label": "标签", "text": "#德语学习 #德语阅读 #德国医保 #德国生活 #德国冷知识"}], "imgs": [{"src": "1e22b0e73dd3.jpg", "thumb": "_thumb/1e22b0e73dd3.jpg"}, {"src": "e93215a998de.jpg", "thumb": "_thumb/e93215a998de.jpg"}, {"src": "bee2209bf27b.jpg", "thumb": "_thumb/bee2209bf27b.jpg"}, {"src": "c4538d97d384.jpg", "thumb": "_thumb/c4538d97d384.jpg"}, {"src": "8a483a223e8f.jpg", "thumb": "_thumb/8a483a223e8f.jpg"}, {"src": "f37f65325bc9.jpg", "thumb": "_thumb/f37f65325bc9.jpg"}]}, {"key": "queue-20261107_krankenversicherung_theme", "title": "2026-11-07 19:30 · krankenversicherung · theme", "use": "一条笔记发这 1 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "在德国看病不花钱？先看这张卡的名字"}, {"label": "标题 2（选一个）", "text": "德语看病必备：黄单子、Kasse、Termin"}, {"label": "标题 3（选一个）", "text": "德国医保：为什么每个人都问你 GKV 还是 PKV"}, {"label": "正文", "text": "在德国看病，前台只看一张卡，全程不提钱——\n但月底工资单上，医保扣款是 **17,5%**。\n\n四个直接能用的德语说法：\n🏥 **Ich bin in der Kasse.** = 我有法定医保\n（正式说法：*gesetzlich krankenversichert*）\n\n📅 **Haben Sie noch was frei?** = 您还有空位吗\n（就是「我能预约吗」，比 Termin vereinbaren 口语得多）\n\n🟨 **Kann ich den gelben Schein haben?** = 能开黄单子吗\n（病假条的德语全称长得吓人，德国人只说「黄单子」）\n\n💳 **Hier, meine Karte.** = 给，我的卡\n（Versichertenkarte 的口语简称）\n\n德语小知识：约医生难，所以「还有空位吗」几乎天天说。\n\n#德语学习 #德语口语 #德国医保 #德国生活 #德语"}, {"label": "标签", "text": "#德语学习 #德语口语 #德国医保 #德国生活 #德语"}], "imgs": [{"src": "27037b8a221b.jpg", "thumb": "_thumb/27037b8a221b.jpg"}]}, {"key": "queue-20261108_barrierefreiheit_news", "title": "2026-11-08 19:30 · barrierefreiheit · news", "use": "一条笔记发这 6 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "轮椅出门看展，德国人做了张「无障碍博物馆地图」"}, {"label": "标题 2（选一个）", "text": "德国博物馆写的那句 barrierefrei，其实常常只有「有电梯」"}, {"label": "标题 3（选一个）", "text": "一个德国人做了个网站：把博物馆的电梯、车位、陪同免票全查清"}, {"label": "正文", "text": "对坐轮椅的人来说，出门看展常常要先打一堆电话：有没有电梯？有没有车位？陪同的人要不要买票？\n\n德国人 **Christoph Hein** 做了个网站 **Museums-Atlas**，把这些一次查清：\n\n🛗 按「有电梯」筛\n🅿️ 按「有残疾人停车位」筛\n📍 按某个联邦州筛\n🎟️ 还能筛「陪同者入场免费」的\n\n覆盖 8 个国家，他做这些**不赚钱**——因为他自己家里就有一个坐轮椅的孩子。\n\n有意思的是那句挂在德国博物馆门口的词：**barrierefrei**（无障碍）。Jonas 的经验是，它常常只保证「有电梯」，特展能不能进、陪同要不要买票，官网往往不写。\n\n同类的还有 **Wheelmap**（众包红黄绿灯）和 **„Reisen für alle“**（一套无障碍认证）。\n\n你还见过哪些「看起来无障碍、其实进不去」的地方？"}, {"label": "标签", "text": "#德语学习 #德国生活 #无障碍 #残障 #德国留学"}], "imgs": [{"src": "228b55e20eff.jpg", "thumb": "_thumb/228b55e20eff.jpg"}, {"src": "b3ba02ec1616.jpg", "thumb": "_thumb/b3ba02ec1616.jpg"}, {"src": "86fcf1d05e76.jpg", "thumb": "_thumb/86fcf1d05e76.jpg"}, {"src": "e4cb8be41b7f.jpg", "thumb": "_thumb/e4cb8be41b7f.jpg"}, {"src": "1014b5f683b1.jpg", "thumb": "_thumb/1014b5f683b1.jpg"}, {"src": "059686cdcf94.jpg", "thumb": "_thumb/059686cdcf94.jpg"}]}, {"key": "queue-20261109_barrierefreiheit_theme", "title": "2026-11-09 19:30 · barrierefreiheit · theme", "use": "一条笔记发这 1 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "「无障碍」在德国，不只是一句 barrierefrei"}, {"label": "标题 2（选一个）", "text": "德国那句 barrierefrei，到底保证什么？"}, {"label": "标题 3（选一个）", "text": "barrierefrei 里的 frei，是「没有」的意思"}, {"label": "正文", "text": "德国博物馆门口常挂一块牌子：**barrierefrei**（无障碍）。\n\n但这个词其实很笼统。它本该同时管三件事：\n\n🏛️ 建筑：坡道、电梯、无障碍卫生间\n🤟 沟通：手语、盲文、易读版\n💻 数字：屏幕阅读器、无障碍网页\n\n现实里，很多地方只做到了建筑那一半，就挂上了牌子。\n\n德国有约 **780 万人**是重度残障（约占总人口 **9,4 %**，差不多每 10 个人里 1 个）；按更宽的定义，德国有残障的人约 **1300 万**。而且这里面 **91 %** 是疾病造成的——「无障碍」其实是大多数人迟早会遇到的事。\n\n顺便记一个词法：**barriere + frei ＝ 没有障碍**。同族还有：\n\n· kostenfrei 免费\n· rauchfrei 无烟\n· zuckerfrei 无糖\n· stufenlos 无台阶\n\n你在德国见过哪些真正无障碍、哪些只是「挂个牌子」的地方？"}, {"label": "标签", "text": "#德语学习 #德国文化 #德语词汇 #无障碍 #barrierefrei"}], "imgs": [{"src": "dc6469675c96.jpg", "thumb": "_thumb/dc6469675c96.jpg"}]}, {"key": "queue-20261112_dienstrad_news", "title": "2026-11-12 19:30 · dienstrad · news", "use": "一条笔记发这 6 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "德国公司真的会给员工发自行车"}, {"label": "标题 2（选一个）", "text": "同事骑新车上班，我问了一句，结果尴尬了"}, {"label": "标题 3（选一个）", "text": "德国公司配的自行车，三年后居然可以买断"}, {"label": "正文", "text": "在德国，很多公司给员工配自行车——但它**不是送**，更像「公司替你租」。\n\n2025 年的数据：约 **34,2 万家企业**提供，约 **2.260 万在职者**有资格，差不多一半。但真正用的只有约 **240 万人**，占合格者的 **11%**。\n\n到底有哪几种形式？\n\n① **额外送（on top）**：公司全额出钱，车在工资之外给你用，私人使用**免税**（到 2030 年底）。最少见。\n② **工资转化租赁（Gehaltsumwandlung）**：公司去租，你从**税前工资**里付月供。最常见，JobRad 就是这种。\n③ **公司补贴（Zuschuss）**：公司替你付一部分月供。\n\n那车到底归谁？\n\n· 合同期内：车属于租赁方/公司\n· 合同通常 **3 年**\n· 期满后：可以**按残值买断**（税务上一般按标价的 40% 算），车归你；也可以还回去\n\n为什么几乎不交税？工资转化模式按标价的 **0,25%/月** 计税。\n例：4.000 欧的 E-Bike → 每月应税 10 欧，按 37% 税率约 **3,72 欧/月**的税。\n\n⚠️ 代价：养老金、失业金的计算基数会低一点；换工作、保险、保养这些也要提前问清。\n\n你在德国上班吗？公司有没有这项福利？"}, {"label": "标签", "text": "#德语学习 #德国生活 #德国工作 #德国福利 #Dienstrad"}], "imgs": [{"src": "4d4fe789a95c.jpg", "thumb": "_thumb/4d4fe789a95c.jpg"}, {"src": "2754a3bc6ee7.jpg", "thumb": "_thumb/2754a3bc6ee7.jpg"}, {"src": "dad25f35ec6d.jpg", "thumb": "_thumb/dad25f35ec6d.jpg"}, {"src": "e344ffca0a97.jpg", "thumb": "_thumb/e344ffca0a97.jpg"}, {"src": "b4cf68398c26.jpg", "thumb": "_thumb/b4cf68398c26.jpg"}, {"src": "5e2ee063e8b0.jpg", "thumb": "_thumb/5e2ee063e8b0.jpg"}]}, {"key": "queue-20261113_dienstrad_theme", "title": "2026-11-13 19:30 · dienstrad · theme", "use": "一条笔记发这 1 张，按顺序（第一张＝封面）。19:00–21:00 发。", "blocks": [{"label": "标题 1（选一个）", "text": "德国公司配的自行车，三年后可以买断"}, {"label": "标题 2（选一个）", "text": "德国公司为什么给你配自行车？三种形式讲清楚"}, {"label": "标题 3（选一个）", "text": "Dienstrad：公司替你租车，月供从税前工资扣"}, {"label": "正文", "text": "「公司发自行车」这句话，在德国要拆开看。\n\n🚲 **三种形式**\n· 额外送：公司在工资之外全额出钱，私人使用免税到 2030 年\n· 工资转化租赁：公司去租，你从税前工资付月供（最常见）\n· 公司补贴：公司替你付一部分\n\n📄 **归属和买断**\n· 合同期通常 **3 年**，期内车属于租赁方/公司\n· 期满后可以**按残值买断**，车归你；也可以还回去\n· 税务上一般按标价的 **40%** 算残值\n\n🧾 **为什么几乎不交税**\n工资转化模式按标价的 **0,25%/月** 计税：\n4.000 欧的 E-Bike → 每月应税 10 欧。\n\n📊 **一个反常识的数据**\n2025 年约一半德国在职者有资格，但只有 **11%** 真的在用。\n\n德语小知识：\n· 课本：*Mir wurde ein Dienstfahrrad zur Verfügung gestellt.*\n· 日常：*Ich hab' ein Firmenrad.*\n· 买断：*Nach drei Jahren kann ich's rauskaufen.*\n\n#德语学习 #德语口语 #德国工作 #德国生活 #Dienstrad"}, {"label": "标签", "text": "#德语学习 #德语口语 #德国工作 #德国生活 #Dienstrad"}], "imgs": [{"src": "37ca71349c0b.jpg", "thumb": "_thumb/37ca71349c0b.jpg"}]}]}, {"name": "📦 家长作业打印 · 小红书实验", "tag": "7 天 · 3 篇笔记 · 7 张图 · 点图开原图，长按存高清", "items": [{"key": "zuoye-xhs-all", "title": "作业打印 · 3 篇笔记（共用 7 张图）", "use": "三篇笔记共用这 7 张图，按 01→07 顺序上传（第一张＝封面）。每篇用对应的标题 / 正文 / 标签。评论区留年级 → 私信 → 发样本 → 拉群；正文和标签里不要出现“微信”。", "imgs": [{"src": "6f0791259d1b.png", "thumb": "_thumb/6f0791259d1b.jpg"}, {"src": "f2af93d37b4e.png", "thumb": "_thumb/f2af93d37b4e.jpg"}, {"src": "a30ad0432b45.png", "thumb": "_thumb/a30ad0432b45.jpg"}, {"src": "e42bc85ad4ba.png", "thumb": "_thumb/e42bc85ad4ba.jpg"}, {"src": "ba52f89911c6.png", "thumb": "_thumb/ba52f89911c6.jpg"}, {"src": "bfa86861a3c5.png", "thumb": "_thumb/bfa86861a3c5.jpg"}, {"src": "5de53421a6be.png", "thumb": "_thumb/5de53421a6be.jpg"}], "blocks": [{"label": "笔记一 · 前后对比（主实验） · 标题（选一个）", "text": "老师发的作业，我排成了 A4 打印版\n老师发 Word，家长打印全是乱的\n别跑打印店了，老师发的作业直接印"}, {"label": "笔记一 · 前后对比（主实验） · 正文", "text": "老师在群里发的作业，经常是一段纯文字，或者一个 Word。\n\n家长打开就乱：字挤在一起，没有答题的地方，打印出来孩子没法写。\n\n我做的事很简单：你把老师发的原样转给我，我排成一页 A4 的 PDF，打开直接打印。\n\n数学口算、语文田字格、拼音、英语字母，都能按老师这周的进度做。\n\n不卖课，也不卖资料。先把排版这件事做好。\n\n需要的评论区留年级，我发你一份看看。"}, {"label": "笔记一 · 前后对比（主实验） · 标签", "text": "#作业打印 #小学作业 #一年级 #田字格 #拼音 #家长日常 #学习资料 #南昌 #打印 #幼小衔接"}, {"label": "笔记二 · 按进度生成 · 标题（选一个）", "text": "一年级田字格，按老师进度一页页排\n老师教到哪，田字格就做到哪\n这周学第 5 课，生字拼音都排好了"}, {"label": "笔记二 · 按进度生成 · 正文", "text": "一年级家长应该都懂：老师这周教到第几课，孩子的田字格就要写到第几课。\n\n但买来的字帖，顺序和课本对不上；自己画格子，大小又不统一。\n\n我的做法是：老师发到哪一课，我就把这一课的生字、拼音、笔顺排成一页 A4。打印出来直接写。\n\n数学口算、英语字母也一样，按老师这周的进度来。\n\n需要的评论区留年级，我发你一份这周的看看。"}, {"label": "笔记二 · 按进度生成 · 标签", "text": "#一年级 #田字格 #拼音 #生字 #小学语文 #作业打印 #家长 #南昌 #幼小衔接 #学习资料"}, {"label": "笔记三 · Word / 打印店痛点 · 标题（选一个）", "text": "老师发的 Word，打印出来全是乱的\n去打印店调格式，比孩子写作业还慢\n手机打开 Word 就变形，问题出在这"}, {"label": "笔记三 · Word / 打印店痛点 · 正文", "text": "Word 在手机上打开，格式经常跑掉：该换行的地方不换，表格挤成一团。\n\n拿去打印店，老板还要问你“这个要怎么排”，调半天，最后打出来还是不对。\n\n我直接把它转成 PDF：A4 排好，字距、行距、答题空间都固定，家里打印机打开就印。\n\n数学口算、语文田字格、拼音、英语字母都能做。\n\n需要的评论区留年级。"}, {"label": "笔记三 · Word / 打印店痛点 · 标签", "text": "#作业打印 #Word排版 #家长 #小学作业 #打印 #PDF #南昌 #一年级 #学习资料"}]}]}, {"name": "🧑‍🏫 本地师训 · 路线A", "tag": "小红书引流 → 免费分享 → 自费工作坊 · 2026-10-17", "items": [{"key": "shixun-xhs", "title": "小红书 · 语言老师向 · 分级阅读", "use": "配图 4 张：封面、A1、B1、生词表。点图开原图、长按存高清。评论区留「德语」→ 私信 → 加微信 → 拉群；正文和评论里别出现“微信”。", "imgs": [{"src": "050804bb8ecc.jpg", "thumb": "_thumb/050804bb8ecc.jpg"}, {"src": "134a958d486f.jpg", "thumb": "_thumb/134a958d486f.jpg"}, {"src": "a36c6e510f91.jpg", "thumb": "_thumb/a36c6e510f91.jpg"}, {"src": "6e4fcdf28dcc.jpg", "thumb": "_thumb/6e4fcdf28dcc.jpg"}], "blocks": [{"label": "标题 1（选一个）", "text": "同一条新闻，我做了 A1 到 B2 四个难度"}, {"label": "标题 2（选一个）", "text": "一个班水平差太多，我把一篇新闻拆成了四份"}, {"label": "标题 3（选一个）", "text": "每句德语下面都有中文，学生自己就能对照"}, {"label": "正文", "text": "做德语分级阅读最麻烦的，是同一个班水平差得远。\n\nA1 的学生看不懂 B2 的文章，B2 的学生又嫌 A1 太简单。\n\n后来我换了个做法：一条新闻，先拆成信息点，再按四档重写。\n\nA1 一句一个意思，句子压到最短。A2 加连接词。B1 补背景和数据。B2 保留原文的句式和细节。\n\n每句德语下面跟一行中文，学生自己就能对照，不用一直问老师。\n\n最后再出一页生词表，把四档里出现的高频词收在一起。\n\n一条新闻，四份材料，一个班的层次就都照顾到了。\n\n这套流程换成英语材料也能走。老师想看四档长什么样，评论区留个「德语」，我发你。"}, {"label": "标签", "text": "#德语老师 #英语老师 #分级阅读 #教师备课 #语言教学 #教学资源 #南昌"}, {"label": "图片来源（本机路径）", "text": "封面  ~/Desktop/口袋/自媒体/小红书/_师训配图/cover_photo.jpg\nA1    ~/Desktop/口袋/自媒体/小红书/_师训配图/a1_card.jpg\nB1    ~/Desktop/口袋/自媒体/小红书/_师训配图/b1_card.jpg\n生词表 ~/Desktop/口袋/自媒体/小红书/_师训配图/vocab.jpg"}]}, {"key": "shixun-group", "title": "微信群公告 · 拉群后置顶", "use": "第一场分享免费，先收反馈；有人主动问“能不能教我做”，再开 ¥99 那场。", "blocks": [{"label": "群公告", "text": "语言老师 AI 备课群 · 群公告\n\n1. 这个群只做一件事：分享能直接拿去用的备课资料和方法。\n2. 我做的德语分级阅读（A1–B2 四档）、主题页、生词表，会陆续放上来，全部免费，直接下载。\n3. 不发广告、不发招生、不发拼团。发一次移出。\n4. 群里会不定期开一次线上分享，一小时左右，讲我是怎么用 AI 把这些做出来的。人数够了就开。\n5. 想要哪份资料，直接在群里说。不懂就问，我看到会回。\n\n——Leon"}], "imgs": []}, {"key": "shixun-strategy", "title": "跨学科：先深一口井", "use": "不是发帖用的。自己拿主意、或跟老师讲的时候用。", "blocks": [{"label": "结论", "text": "各科都能做出来——对。完全没有壁垒——不对。壁垒从生产能力，转移到了信任和渠道。"}, {"label": "顺序", "text": "语言课（德语/英语）先跑通第一场 → 做 2–3 张跨科样张当证据（先不拿去讲）→ 再带着样张去找对应学科的教研员。先深后广，护城河才守得住。"}, {"label": "提醒", "text": "学科教研组是竖井，语言组的口子不通向数学组。小学是另一种壁垒，不是零壁垒。"}], "imgs": []}]}]});</script></body></html>
