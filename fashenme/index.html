<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>发布包</title>
<style>
:root{--bg:#0a1428;--card:#10203c;--line:#1e3357;--txt:#e8eef7;--dim:#8ba1c4;--gold:#e0b356}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:16px/1.7 -apple-system,"PingFang SC",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;padding:0 0 env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}
h2{font-size:18px;margin:28px 0 4px;color:var(--gold)}
h3{font-size:17px;margin:0;font-weight:600}
.lead{color:var(--dim);font-size:14px}
.bar{position:sticky;top:0;z-index:9;display:flex;justify-content:space-between;
  align-items:center;background:rgba(10,20,40,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:10px 16px;font-size:14px;margin:-16px -16px 12px}
.bar b{color:var(--gold)}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;margin:14px 0}
.item.isdone{opacity:.45}
.item.isdone .imgs img{filter:grayscale(1)}
.imgs{display:flex;gap:2px;background:#000;flex-wrap:wrap}
.imgs a{flex:1 1 46%;min-width:46%;display:block}
.imgs img{width:100%;display:block;height:auto}
.body{padding:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.done{flex:none;font-size:14px;color:var(--dim);display:flex;align-items:center;gap:6px;
  background:#0a1428;border:1px solid var(--line);border-radius:20px;padding:6px 12px;white-space:nowrap}
.done input{width:18px;height:18px;accent-color:var(--gold)}
.use{font-size:14px;color:var(--dim);margin:6px 0 10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.blk{margin:12px 0}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.hd b{font-size:13px;color:var(--gold);font-weight:600}
.hd button{background:var(--gold);color:#0a1428;border:0;border-radius:8px;
  padding:6px 14px;font-size:14px;font-weight:600}
.bd{white-space:pre-wrap;word-break:break-word;background:#0a1428;border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font-size:15px}
.hint{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:20px 0}
.hint li{margin:6px 0;font-size:14px;color:var(--dim)}
.hint b{color:var(--txt)}
code{background:#0a1428;padding:1px 6px;border-radius:5px;color:var(--gold);font-size:13px}
#gate{max-width:360px;margin:18vh auto;text-align:center;padding:0 20px}
#gate h1{margin-bottom:24px}
#gate input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
  font-size:17px;padding:14px;border-radius:12px;text-align:center}
#gate button{width:100%;margin-top:12px;background:var(--gold);color:#0a1428;border:0;
  border-radius:12px;padding:14px;font-size:17px;font-weight:700}
#err{color:#ff8080;font-size:14px;height:20px;margin-top:10px}
</style></head>
<body>

<div class="wrap">
  <div id="app" hidden>
    <h1>发布包</h1>
    <div class="lead" id="upd"></div>
    <div class="bar"><span>已发：<b id="cnt">0 / 0</b></span>
      <button class="done" style="background:transparent;color:var(--dim)" onclick="resetDone()">清空勾选</button></div>
    <div id="list"></div>
    <div class="hint"><b>发之前每次都查这几条</b><ul>
      <li>图里、正文里没有网址 —— 搜 <code>.cn</code> <code>.com</code> <code>http</code> <code>leondeutsch</code></li>
      <li>评论区、主页简介不放联系方式（放一次就吃一次限流）</li>
      <li>小红书一天最多一条</li>
      <li>页面上是缩略图；点开图片再长按，存下来的才是原图</li>
    </ul></div>
  </div>

  <div id="gate">
    <h1>发布包</h1>
    <input id="pw" type="password" placeholder="口令" autocomplete="current-password">
    <button onclick="tryUnlock()">打开</button>
    <div id="err"></div>
  </div>
</div>

<script>
var PWKEY='fashenme-web-pw', DONEKEY='fashenme-done-v1';
function b64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
async function deriveKey(pw,salt){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function unlock(pw){
  var enc=JSON.parse(document.getElementById('enc').textContent);
  var key=await deriveKey(pw,b64(enc.s));
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.i)},key,b64(enc.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function el(t,c){var e=document.createElement(t);if(c)e.className=c;return e}
function render(data){
  document.getElementById('upd').textContent='更新于 '+data.updated;
  var list=document.getElementById('list');
  data.sections.forEach(function(sec){
    var h=el('h2');h.textContent=sec.name;list.appendChild(h);
    if(sec.tag){var t=el('div','lead');t.textContent=sec.tag;list.appendChild(t)}
    sec.items.forEach(function(it){
      var card=el('div','item');card.dataset.k=it.key;
      if(it.imgs&&it.imgs.length){
        var im=el('div','imgs');
        it.imgs.forEach(function(f){
          var a=el('a');a.href='img/'+f.src;a.target='_blank';a.rel='noopener';
          var img=el('img');img.src='img/'+f.thumb;img.loading='lazy';img.decoding='async';img.alt='';
          a.appendChild(img);im.appendChild(a);
        });
        card.appendChild(im);
      }
      var body=el('div','body');
      var top=el('div','top');
      var hh=el('h3');hh.textContent=it.title;top.appendChild(hh);
      var lab=el('label','done');
      var cb=document.createElement('input');cb.type='checkbox';
      lab.appendChild(cb);lab.appendChild(document.createTextNode(' 已发'));
      top.appendChild(lab);body.appendChild(top);
      if(it.use){var u=el('p','use');u.textContent=it.use;body.appendChild(u)}
      (it.blocks||[]).forEach(function(b){
        var blk=el('div','blk');
        var hd=el('div','hd');var bb=el('b');bb.textContent=b.label;hd.appendChild(bb);
        var btn=document.createElement('button');btn.textContent='复制';btn.onclick=function(){cp(btn)};
        hd.appendChild(btn);blk.appendChild(hd);
        var bd=el('div','bd');bd.textContent=b.text;blk.appendChild(bd);
        body.appendChild(blk);
      });
      card.appendChild(body);list.appendChild(card);
    });
  });
  paint();
}
function cp(btn){
  var bd=btn.closest('.blk').querySelector('.bd'), t=bd.innerText;
  if(navigator.clipboard){navigator.clipboard.writeText(t).catch(fb)}else{fb()}
  function fb(){var r=document.createRange();r.selectNodeContents(bd);var s=getSelection();
    s.removeAllRanges();s.addRange(r);try{document.execCommand('copy')}catch(e){}s.removeAllRanges()}
  var o=btn.textContent;btn.textContent='已复制 ✓';setTimeout(function(){btn.textContent=o},1500);
}
function loadDone(){try{return JSON.parse(localStorage.getItem(DONEKEY)||'{}')}catch(e){return{}}}
function saveDone(o){try{localStorage.setItem(DONEKEY,JSON.stringify(o))}catch(e){}}
function paint(){
  var o=loadDone(),n=0,tot=0;
  document.querySelectorAll('.item').forEach(function(e){
    var k=e.dataset.k;if(!k)return;tot++;
    var cb=e.querySelector('input[type=checkbox]');cb.checked=!!o[k];
    e.classList.toggle('isdone',!!o[k]);if(o[k])n++;
  });
  var c=document.getElementById('cnt');if(c)c.textContent=n+' / '+tot;
}
document.addEventListener('change',function(e){
  if(e.target.matches('.done input')){
    var o=loadDone(),e2=e.target.closest('.item');o[e2.dataset.k]=e.target.checked;
    saveDone(o);paint();
  }
});
function resetDone(){if(confirm('清空所有勾选？')){saveDone({});paint()}}
function show(data){
  document.getElementById('gate').hidden=true;
  document.getElementById('app').hidden=false;
  render(data);
}
async function tryUnlock(){
  var pw=document.getElementById('pw').value, err=document.getElementById('err');
  err.textContent='';
  try{
    var data=await unlock(pw);
    try{sessionStorage.setItem(PWKEY,pw)}catch(e){}
    show(data);
  }catch(e){err.textContent='口令不对';}
}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlock()});
(function(){
  var saved=null;try{saved=sessionStorage.getItem(PWKEY)}catch(e){}
  if(saved){unlock(saved).then(show).catch(function(){try{sessionStorage.removeItem(PWKEY)}catch(e){}})}
  else{document.getElementById('pw').focus()}
})();
</script>
</body></html>
