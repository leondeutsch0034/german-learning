<meta name="description" content="📰 柏林市议会选举之后，左翼党（Linke）、绿党（Grüne）和社民党（SPD）结束了试探性组阁谈判，就重要问题达成一致。他们计划：如果共同执政，就把在柏林拥有超过 1 万套住房的大型私营住房公司收归市有——公司可以保留 1 万套，多出来的部分在获得补偿后交给柏林市，目的是让租金降下来。据左翼党方面估算，涉及约 5 家大公司、约 16 万套住房，补偿上限为 160 亿欧元。这还不是法律：法案计划到 2028 年中期才出台，而且还要经过宪法法院审查。同一条新闻改写成 A1 / A2 / B1 / B2 共 4 档，全部是德语原文，配中文对照与生词表，挑你能读的那版。每天一则德国新闻，边读边学德语。来源：nachrichtenleicht.de (Deutschlandfunk) · 2026-10-17">
